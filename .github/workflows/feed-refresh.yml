name: feed-refresh
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.INBOX_CRON_TOKEN }}
        run: curl -fsS -X POST "${{ vars.INBOX_BASE_URL }}/api/feeds/refresh-all" -H "X-Cron-Token:$TOKEN"
