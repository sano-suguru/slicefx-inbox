spin_manifest_version = 2

[application]
name = "slicefx-inbox"
version = "0.1.0"
description = "Personal read-later inbox — dogfooding SliceFx on Fermyon Cloud"

# Spin application variables — set via `spin cloud variables set` or SPIN_VARIABLE_* env vars.
# cron_token: shared admin secret for POST /api/feeds/refresh-all (called by GitHub Actions + local cron).
# registration_open: kill switch for public workspace self-registration.
#   "true" → registration allowed; anything else (including unset) → 403 (fail-closed).
# Workspace tokens are stored in KV (token:{token} → wid) — not in Spin variables.
[variables]
cron_token = { required = true }
registration_open = { required = false, default = "true" }

# API: inbox-server handles all /api/... routes.
# Spike confirmed (2026-05-30): Spin delivers the full :path (/api/items) to a raw
# wasi:http component under route="/api/..." — no strip-compensate needed.
[[trigger.http]]
route = "/api/..."
component = "inbox-server"

# SPA: spin-fileserver serves the Blazor WASM wwwroot under /.
# FALLBACK_PATH=index.html provides deep-link fallback (200 for unknown paths).
# Build Inbox.Client first: dotnet publish src/Inbox.Client -c Release
[[trigger.http]]
route = "/..."
component = "fs"

# Local cron trigger for feed refresh (all workspaces). Spin trigger-cron uses 6-field expressions
# (sec min hour dom month dow) — NOT 7-field; 7-field causes a ParseSchedule error.
# "0 */1 * * * *" = every minute — convenient for local testing.
# Production refresh uses GitHub Actions (*/30 * * * * — every 30 minutes)
# calling POST /api/feeds/refresh-all with X-Cron-Token.
# Fermyon Cloud does not support cron triggers; use spin.cloud.toml for cloud deploys.
[[trigger.cron]]
component = "inbox-server"
cron_expression = "0 */1 * * * *"

[component.inbox-server]
source = "dist/inbox-server.wasm"
allowed_outbound_hosts = ["https://*"]
key_value_stores = ["default"]

[component.inbox-server.variables]
cron_token = "{{ cron_token }}"
registration_open = "{{ registration_open }}"

# spin-fileserver v0.3.0
# Digest: sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148
# files.source is relative to this manifest (src/Inbox.Server/), so use ../
# _framework/*.wasm served as application/wasm out of the box (mime_guess crate).
[component.fs]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "../Inbox.Client/bin/Release/net10.0/publish/wwwroot", destination = "/" }]
environment = { FALLBACK_PATH = "index.html" }
