spin_manifest_version = 2

[application]
name = "slicefx-inbox"
version = "0.1.0"
description = "Personal read-later inbox — dogfooding SliceFx on Fermyon Cloud"

# Spin application variables — set via `spin cloud variables set` or `--variable` flag.
# refresh_token: shared bearer token for mutating endpoints (POST /api/feeds, /api/items, DELETE /api/items/{id}).
# allowed_outbound_hosts remains ["https://*"] because feeds are fully user-supplied (no fixed host list);
# auth on mutating endpoints closes the open-proxy abuse surface instead.
[variables]
refresh_token = { required = true }

[[trigger.http]]
route = "/..."
component = "inbox-server"

# Local cron trigger for feed refresh. Spin trigger-cron uses 6-field expressions
# (sec min hour dom month dow) — NOT 7-field; 7-field causes a ParseSchedule error.
# "0 */1 * * * *" = every minute — convenient for local testing.
# Production refresh uses GitHub Actions (*/30 * * * * — every 30 minutes).
# Fermyon Cloud does not support cron triggers; use spin.cloud.toml for cloud deploys.
[[trigger.cron]]
component = "inbox-server"
cron_expression = "0 */1 * * * *"

[component.inbox-server]
source = "dist/inbox-server.wasm"
allowed_outbound_hosts = ["https://*"]
key_value_stores = ["default"]

[component.inbox-server.variables]
refresh_token = "{{ refresh_token }}"
