<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SliceFx Inbox">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- Inbox tray (bottom ledge) -->
  <rect x="12" y="38" width="40" height="5" rx="2.5" fill="#aad4f5"/>
  <!-- Left wall -->
  <rect x="12" y="20" width="5" height="23" rx="2.5" fill="#aad4f5"/>
  <!-- Right wall -->
  <rect x="47" y="20" width="5" height="23" rx="2.5" fill="#aad4f5"/>
  <!-- Arrow down (deposit indicator) -->
  <polyline points="32,14 32,34" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <polyline points="24,28 32,36 40,28" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
